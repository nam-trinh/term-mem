[package]
name = "tmem"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Local memory layer for terminal AI conversations"
license = "MIT"
publish = false

[[bin]]
name = "tmem"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
refinery = { version = "0.8", features = ["rusqlite"] }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ulid = "1.1"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.13"

[profile.release]
opt-level = 3
lto = true
strip = true
