# cargo-deny configuration. The bans section is the one that encodes a project
# premise rather than a convention: term-mem opens no sockets, so a transitive
# HTTP client or TLS stack appearing in the tree is a design failure and should
# break the build at the moment it lands. See CLAUDE.md.

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
]

[advisories]
yanked = "deny"

[licenses]
# Every license expression in the current tree is satisfied by this set.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "Unicode-3.0",
    "Unlicense",
]

[bans]
# Duplicate versions are a hygiene issue, not a correctness one, and this tree
# is small enough to notice them by hand.
multiple-versions = "allow"
wildcards = "deny"

deny = [
    { crate = "reqwest", reason = "no network: nothing leaves the machine" },
    { crate = "hyper", reason = "no network: nothing leaves the machine" },
    { crate = "ureq", reason = "no network: nothing leaves the machine" },
    { crate = "isahc", reason = "no network: nothing leaves the machine" },
    { crate = "attohttpc", reason = "no network: nothing leaves the machine" },
    { crate = "surf", reason = "no network: nothing leaves the machine" },
    { crate = "curl", reason = "no network: nothing leaves the machine" },
    { crate = "curl-sys", reason = "no network: nothing leaves the machine" },
    { crate = "socket2", reason = "no network: nothing leaves the machine" },
    { crate = "tonic", reason = "no network: nothing leaves the machine" },
    { crate = "native-tls", reason = "a TLS stack implies a socket" },
    { crate = "rustls", reason = "a TLS stack implies a socket" },
    { crate = "openssl", reason = "a TLS stack implies a socket" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
