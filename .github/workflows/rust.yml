name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

# Least privilege for GITHUB_TOKEN. Without this the workflow inherits the
# repository default, which is usually write access it never uses — flagged by
# CodeQL as `actions/missing-workflow-permissions`. This job only reads the
# checkout.
permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
